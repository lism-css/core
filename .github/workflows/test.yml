name: Test
on:
  # main・dev への push では走らせない。PR チェック後に別の PR が dev に入った場合の
  # マージ後の組み合わせ確認は、一人で順番にマージする運用のため省いている（#623）
  pull_request:
    # ビルド・テストに影響しない文書だけの変更では走らせない
    paths-ignore:
      - "docs/**"
      - "documents/**"
      - ".plan/**"
      - ".claude/**"
      - ".github/copilot-instructions.md"
      - "*.md"

permissions:
  contents: read

# 同じ PR に push が重なったら、実行中の古い run はキャンセルして最新の 1 件だけ走らせる
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# ジョブ構成:
# - 各ジョブは独立して並列に走る。typecheck / test は turbo の ^build 依存で必要な依存パッケージを自前でビルドするため、
#   build ジョブの成果物を受け渡す必要がない（受け渡してもキャッシュが無い turbo は再ビルドしていた）
# - apps/site のビルドは 4 分前後かかり他の全パッケージより長いので、別ジョブに分けて他のチェックを待たせない
# - turbo のローカルキャッシュ（.turbo/cache）を actions/cache で run 間に引き継ぐ。restore-keys は自ジョブの接頭辞を先に探す。
#   共通の Linux-turbo- だけだと最も新しく保存された別ジョブのキャッシュが選ばれ、自ジョブのタスク結果が当たらない
#   （build-site は保存しないので、依存パッケージのビルド結果を持つ build ジョブのものを読む）
# - PR から読めるのは同じ PR の前回 run と base / default branch のキャッシュ。dev では CI が走らず、main の deploy のキャッシュは
#   dev とハッシュがずれてほぼ当たらないため、PR の初回 run は実質キャッシュ無しになる
# - .turbo/cache は turbo 側で削除されず増え続けるので、保存前に 7 日以上前のエントリを消して肥大化を抑える（deploy.yml と同じ）

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-

      - name: Prune stale Turborepo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/site は build-site ジョブで別にビルドする
      - name: Build
        run: pnpm build --filter='!lism-site'

  build-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      # 読み取りのみ。apps/site の dist（約 80MB）は PR ごとに変わりほぼ再利用されないので、キャッシュに積まない
      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-build-site-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-build-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build:site

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-typecheck-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-typecheck-
            ${{ runner.os }}-turbo-

      - name: Prune stale Turborepo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-lint-
            ${{ runner.os }}-turbo-

      - name: Prune stale Turborepo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-test-
            ${{ runner.os }}-turbo-

      - name: Prune stale Turborepo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @lism-css/catalog exec playwright install chromium --with-deps

      # 依存パッケージのビルドがキャッシュに乗ると全パッケージのテストが同時に走り出し、4 vCPU のランナーでは
      # 実ビルドを伴う plugin のテストが 5 秒のタイムアウトを超える（#512 と同じ症状）。turbo 既定の 10 並列を絞る
      - name: Run tests
        run: pnpm test --concurrency=3

  templates-private-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check templates are private
        run: node scripts/check-templates-private.mjs
